name: Shell Script CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Verificar scripts .sh com ShellCheck
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck

      - name: Testar sintaxe bash (Dry-run)
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -I {} bash -n {}
